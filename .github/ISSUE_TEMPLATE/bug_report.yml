name: Relatar um bug
description: Informe um problema reproduzível na Maia.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Versão da Maia
      placeholder: Ex. 5.3.0-beta.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      placeholder: Ex. Windows 10 22H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Liste os passos na ordem em que foram feitos.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que deveria acontecer
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs ou capturas
      description: Remova tokens, chaves, nomes e endereços privados.
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmação
      options:
        - label: Revisei o conteúdo e removi informações privadas.
          required: true
